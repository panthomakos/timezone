name: Release

# Pushing a version tag (e.g. `1.3.31`) builds the gem, publishes it to
# RubyGems.org via Trusted Publishing, and creates the matching GitHub release.
#
# Running this workflow manually (Actions tab -> Release -> Run workflow) is a
# dry run: it performs every check, builds the gem and obtains RubyGems.org
# credentials, but does not publish anything.

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Ruby
      uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      with:
        ruby-version: '3.4'
        bundler-cache: true
    - name: Check version
      id: version
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        version=$(ruby -Ilib -rtimezone/version -e 'print Timezone::VERSION')
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Timezone::VERSION is $version"

        if ! grep -Fqx "# $version" CHANGES.markdown; then
          echo "::error::CHANGES.markdown has no '# $version' section"
          exit 1
        fi

        if [ "$REF_TYPE" = tag ]; then
          if [ "$REF_NAME" != "$version" ]; then
            echo "::error::Tag $REF_NAME does not match Timezone::VERSION $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::Tag $REF_NAME is not on master"
            exit 1
          fi
        fi
    - name: Run Tests
      run: bundle exec rake utc test
    - name: Build Gem
      run: gem build timezone.gemspec
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: gem
        path: timezone-${{ steps.version.outputs.version }}.gem
        if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # RubyGems.org Trusted Publishing
    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: gem
    - name: Set up Ruby
      uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      with:
        ruby-version: '3.4'
    - name: Configure RubyGems Credentials
      uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
    - name: Push Gem
      if: github.event_name == 'push'
      run: gem push "timezone-$VERSION.gem"
    - name: Create GitHub Release
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ruby -e '
          lines = File.readlines("CHANGES.markdown", chomp: true)
          start = lines.index("# #{ENV.fetch("VERSION")}") or abort "No changelog section"
          notes = lines[(start + 1)..].take_while { |l| !l.start_with?("# ") }
          puts notes.join("\n").strip.gsub(/\[(@\w+)\]\[\]/, "\\1")
        ' > release-notes.md
        cat release-notes.md
        gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file release-notes.md
    - name: Dry Run Summary
      if: github.event_name != 'push'
      run: |
        echo "Dry run: built timezone-$VERSION.gem and obtained RubyGems.org" \
          "credentials. Nothing was published." >> "$GITHUB_STEP_SUMMARY"
