name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Each job runs in the official ruby Docker image rather than using
# ruby/setup-ruby, which only provides binaries for Rubies that are still
# built for the current ubuntu-latest image. This keeps EOL Rubies in the
# matrix without pinning the runner to an older Ubuntu.
jobs:
  test:
    runs-on: ubuntu-latest
    container: ruby:${{ matrix.ruby-version }}
    strategy:
      matrix:
        ruby-version: ['2.5', '2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0']

    steps:
    - uses: actions/checkout@v2
    - name: Install Dependencies
      run: bundle install
    - name: Run Tests
      run: bundle exec rake utc test

  rubocop:
    runs-on: ubuntu-latest
    container: ruby:${{ matrix.ruby-version }}
    strategy:
      matrix:
        ruby-version: ['3.0']

    steps:
    - uses: actions/checkout@v2
    - name: Install Dependencies
      run: bundle install
    - name: Run Rubocop
      run: bundle exec rubocop
